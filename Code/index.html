<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Board Game Tutor</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg1: #DDDFF5;
            --bg2: #FFFFFF;
            --ink: #1B2238;
            --felt: #2F6BFF;
            --pt: #fff;
            --card: #fff;
            --line: #D5D9EC;
            --red: #D6453D;
            --ok: #1F7A4D;
            --mut: #5F6784;
            --sb: rgba(255, 255, 255, .55);
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg1: #161F40;
                --bg2: #0B1124;
                --ink: #E7EBFA;
                --felt: #6C98FF;
                --pt: #0B1124;
                --card: #18213F;
                --line: #2B3764;
                --mut: #9AA6CF;
                --ok: #4CC38A;
                --red: #F07A72;
                --sb: rgba(24, 33, 63, .7)
            }
        }

        :root[data-theme="dark"] {
            --bg1: #161F40;
            --bg2: #0B1124;
            --ink: #E7EBFA;
            --felt: #6C98FF;
            --pt: #0B1124;
            --card: #18213F;
            --line: #2B3764;
            --mut: #9AA6CF;
            --ok: #4CC38A;
            --red: #F07A72;
            --sb: rgba(24, 33, 63, .7)
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        body {
            margin: 0;
            color: var(--ink);
            background: linear-gradient(160deg, var(--bg1), var(--bg2) 65%) fixed, var(--bg2);
            font: 16px/1.6 'Noto Sans Thai', system-ui, sans-serif
        }

        #shell {
            display: flex;
            min-height: 100vh
        }

        aside {
            width: 230px;
            flex: none;
            align-self: flex-start;
            position: sticky;
            top: env(safe-area-inset-top, 0px);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: 14px 0;
            background: var(--sb);
            border-right: 1px solid var(--line);
            transition: width .2s
        }

        aside svg {
            flex: none;
            color: var(--felt)
        }

        aside button {
            background: none;
            border: 0;
            cursor: pointer;
            color: var(--felt);
            padding: 0
        }

        #mb {
            align-self: flex-end;
            margin: 0 21px 12px 0
        }

        aside nav a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 21px;
            color: var(--ink);
            text-decoration: none;
            border-top: 1px solid var(--line);
            font-weight: 600;
            font-size: 15px
        }

        aside nav a.on {
            background: color-mix(in srgb, var(--felt) 13%, transparent)
        }

        .out {
            margin: auto 0 0 21px;
            padding: 8px 0 !important;
            align-self: flex-start
        }

        .mini aside {
            width: 62px
        }

        .mini aside nav span {
            display: none
        }

        @media(max-width:760px) {
            aside {
                width: 62px
            }

            aside nav span {
                display: none
            }

            .mainw {
                padding: 18px 14px 64px !important
            }
        }

        .mainw {
            flex: 1;
            min-width: 0;
            padding: 24px 30px 64px
        }

        .sbar {
            position: relative;
            max-width: 640px;
            margin: 0 auto 28px
        }

        .sbar span {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            color: var(--mut)
        }

        .sbar input {
            width: 100%;
            padding: 13px 20px 13px 52px;
            border-radius: 999px;
            border: 1.5px solid var(--mut);
            background: transparent;
            color: var(--ink);
            font: inherit
        }

        main {
            max-width: 960px;
            margin: 0 auto
        }

        h1,
        h2 {
            font-weight: 700;
            line-height: 1.4;
            margin: .2em 0 .6em
        }

        h1 {
            font-size: 24px
        }

        h2 {
            font-size: 17px;
            margin-top: 1.1em
        }

        a {
            color: var(--felt)
        }

        .mut {
            color: var(--mut)
        }

        .hm {
            display: grid;
            grid-template-columns: minmax(0, 1.9fr) minmax(0, 1fr);
            gap: 36px
        }

        @media(max-width:820px) {
            .hm {
                grid-template-columns: 1fr;
                gap: 8px
            }
        }

        .feat {
            display: flex;
            align-items: flex-end;
            height: 190px;
            border-radius: 18px;
            padding: 18px;
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            font-size: 17px;
            background: linear-gradient(115deg, #13A050 0 52%, #1F2B5A 52%)
        }

        .feat i {
            width: 34px;
            height: 34px;
            border: 2px solid #fff;
            border-radius: 9px;
            display: inline-grid;
            place-items: center;
            margin-right: 10px
        }

        .feat svg {
            color: #fff
        }

        .tags {
            margin: 12px 0 4px
        }

        .cats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px
        }

        .cat {
            aspect-ratio: 1;
            border-radius: 14px;
            color: #fff;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-decoration: none;
            font-weight: 700
        }

        .cat svg {
            color: #fff
        }

        .grid {
            display: grid;
            gap: 14px;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr))
        }

        .card,
        .card2 {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 16px;
            color: inherit
        }

        .card {
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-decoration: none
        }

        a.card:hover {
            border-color: var(--felt)
        }

        .card2 {
            margin: 12px 0
        }

        .em {
            font-size: 34px;
            line-height: 1.2
        }

        .n {
            font-size: 28px;
            font-weight: 700;
            line-height: 1.2
        }

        .tag {
            display: inline-block;
            background: color-mix(in srgb, var(--mut) 14%, transparent);
            border-radius: 999px;
            padding: 1px 12px;
            font-size: 13px;
            margin: 0 6px 4px 0
        }

        label {
            display: block;
            font-weight: 600
        }

        .in,
        select,
        textarea {
            width: 100%;
            padding: 10px 13px;
            margin: 6px 0 12px;
            font: inherit;
            font-weight: 400;
            color: var(--ink);
            background: var(--card);
            border: 1.5px solid var(--line);
            border-radius: 10px
        }

        .btn {
            font: inherit;
            font-weight: 600;
            padding: 9px 18px;
            border-radius: 10px;
            border: 2px solid var(--felt);
            background: transparent;
            color: var(--felt);
            cursor: pointer;
            text-decoration: none;
            display: inline-block
        }

        .btn.pri {
            background: var(--felt);
            color: var(--pt)
        }

        .btn:disabled {
            opacity: .4;
            cursor: default
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 14px 0
        }

        .opt {
            display: block;
            width: 100%;
            text-align: left;
            font: inherit;
            color: var(--ink);
            background: var(--card);
            border: 2px solid var(--line);
            border-radius: 10px;
            padding: 11px 14px;
            margin: 8px 0;
            cursor: pointer
        }

        .opt:hover:not(:disabled) {
            border-color: var(--felt)
        }

        .opt.ok {
            border-color: var(--ok)
        }

        .opt.bad {
            border-color: var(--red)
        }

        .fb {
            padding: 12px 14px;
            border-radius: 10px;
            border-left: 6px solid;
            background: var(--card);
            margin: 12px 0
        }

        .fb.ok {
            border-color: var(--ok)
        }

        .fb.bad {
            border-color: var(--red)
        }

        .bar {
            height: 10px;
            background: var(--line);
            border-radius: 9px;
            overflow: hidden;
            margin: 8px 0
        }

        .bar i {
            display: block;
            height: 100%;
            background: var(--felt)
        }

        .ck {
            list-style: none;
            padding: 0;
            margin: 4px 0;
            font-size: 14px
        }

        summary {
            cursor: pointer
        }

        :focus-visible {
            outline: 3px solid var(--felt);
            outline-offset: 2px
        }

        #t {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            background: var(--ink);
            color: var(--bg2);
            padding: 10px 18px;
            border-radius: 10px;
            display: none;
            z-index: 9;
            max-width: 92%
        }

        .cds {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 16px 0 4px
        }

        .cd {
            width: 124px;
            min-height: 176px;
            padding: 12px 10px;
            border-radius: 14px;
            border: 2px solid hsl(var(--h) 50% 42%);
            background: linear-gradient(160deg, hsl(var(--h) 75% 94%), hsl(var(--h) 65% 82%));
            color: #1B2238;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 6px;
            box-shadow: 0 3px 0 hsl(var(--h) 50% 42% / .35)
        }

        .ci {
            font-size: 40px;
            line-height: 1.1
        }

        .cd b {
            font-size: 14px;
            line-height: 1.3
        }

        .cd small {
            font-size: 12px;
            line-height: 1.35
        }

        @media(prefers-reduced-motion:no-preference) {
            .cd {
                transition: transform .15s
            }

            .cd:hover {
                transform: translateY(-4px) rotate(-1.5deg)
            }
        }

        .cv {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 14px 0;
            min-height: 120px
        }

        .bb {
            max-width: 88%;
            padding: 10px 14px;
            border-radius: 14px;
            border: 1px solid var(--line);
            background: var(--card);
            overflow-wrap: anywhere
        }

        .bb.u {
            align-self: flex-end;
            background: var(--felt);
            color: var(--pt);
            border-color: var(--felt)
        }

        .bb.err {
            border-color: var(--red)
        }

        .src {
            margin-top: 6px
        }

        .chips {
            margin: 6px 0 10px
        }

        .chips .tag {
            border: 0;
            cursor: pointer;
            font-family: inherit;
            color: var(--ink)
        }

        .ask {
            display: flex;
            gap: 8px;
            align-items: flex-start
        }

        .ask .in {
            margin: 0;
            flex: 1
        }
    </style>
</head>

<body>
    <div id="shell">
        <aside><button id="mb" aria-label="ย่อหรือขยายเมนู" onclick="document.body.classList.toggle('mini')"></button>
            <nav id="nv"></nav><button class="out" aria-label="ออกจากระบบ" title="ออกจากระบบ" onclick="lo()"></button>
        </aside>
        <div class="mainw">
            <div class="sbar"><span id="si"></span><input id="s" placeholder="ค้นหาบอร์ดเกม เช่น กฎ, ชื่อเกม..."
                    aria-label="ค้นหาเกมและกฎ" oninput="sq()"></div>
            <main id="app"></main>
        </div>
    </div>
    <div id="t" role="status"></div>
    <script>
        const SEED = [

                ['ไพ่แอ็กชัน', 'Attack จบตาโดยไม่จั่วและให้คนถัดไปเล่น 2 ตา, Skip จบตาโดยไม่จั่ว, Favor ให้เพื่อนเลือกไพ่ส่งให้คุณ 1 ใบ, Shuffle สับกองจั่ว, See the Future ดูไพ่บนสุด 3 ใบ', [['⚔️', 'Attack', 'จบตาไม่จั่ว คนถัดไปเล่น 2 ตา', 0], ['⏭️', 'Skip', 'จบตาไม่จั่ว', 215], ['🎁', 'Favor', 'เพื่อนเลือกไพ่ส่งให้คุณ', 280], ['🔀', 'Shuffle', 'สับกองจั่ว', 175], ['🔮', 'See the Future', 'ดูไพ่บนสุด 3 ใบ', 245]]],
                ['Nope และไพ่แมว', 'Nope ยกเลิกแอ็กชันของคนอื่นได้ ยกเว้น Exploding Kitten และ Defuse และ Nope ก็ถูก Nope ได้อีกที ส่วนไพ่แมวหน้าเหมือนกัน 2 ใบเล่นเป็นคู่เพื่อขโมยไพ่สุ่ม 1 ใบจากเพื่อน', [['🚫', 'Nope', 'ยกเลิกแอ็กชัน ยกเว้นระเบิดและ Defuse', 350], ['🐱', 'ไพ่แมวคู่', 'ขโมยไพ่สุ่ม 1 ใบ', 45]]],

            },
            {

            const g = G1(id); if (P.id != id) P = { id, i: 0, a: null }; const x = g.sit[P.i];
            if (!x) return app(back(id) + '<h1>ฝึกสถานการณ์</h1><p>เกมนี้ยังไม่มีสถานการณ์ให้ฝึก</p>');
            app(`${back(id)}<h1>ฝึกสถานการณ์</h1><p class="mut">สถานการณ์ที่ ${P.i + 1} จาก ${g.sit.length}</p><div class="card2"><p><b>${E(x.c)}</b></p>${opts(x, P.a, 'pa')}</div>${P.a == null ? '' : fb(x, P.a) + `<button class="btn pri" onclick="pn()">${P.i == g.sit.length - 1 ? 'จบการฝึก' : 'สถานการณ์ถัดไป'}</button>`}`)
        }
        const pa = j => { P.a = j; prac(P.id) };
        function pn() { const g = G1(P.id); if (P.i == g.sit.length - 1) location.hash = '#/game/' + g.id; else { P.i++; P.a = null; prac(g.id) } }

        /* FR-4 ทดสอบความเข้าใจ */
        function quiz(id) {
            const g = G1(id), n = g.qz.length;
            if (!g.st.length || dn(g) < g.st.length) return app(`${back(id)}<h1>ทดสอบความเข้าใจ</h1><div class="card2"><p>เรียนบทเรียนให้ครบก่อนจึงจะทดสอบได้ (ตอนนี้ ${dn(g)} จาก ${g.st.length} ขั้นตอน)</p><a class="btn pri" href="#/tut/${id}">ไปเรียนต่อ</a></div>`);
            if (!n) return app(back(id) + '<h1>ทดสอบความเข้าใจ</h1><p>เกมนี้ยังไม่มีข้อสอบ</p>');
            if (Q.id != id) Q = { id, i: 0, a: null, s: 0 };
            if (Q.i >= n) {
                const b = S.q[id] = Math.max(S.q[id] || 0, Q.s); save();
                return app(`${back(id)}<h1>ผลการทดสอบ</h1><div class="card2"><h2>${Q.s} / ${n} ข้อ</h2><p>${Q.s == n ? 'พร้อมเล่นแล้ว คุณเข้าใจกฎหลักครบทุกข้อ' : 'ยังมีบางข้อที่ควรทบทวน กลับไปอ่านบทเรียนหรือกฎ แล้วลองใหม่'}</p><p class="mut">คะแนนสูงสุด ${b} / ${n}</p></div><div class="row"><button class="btn pri" onclick="qr()">ทำใหม่</button><a class="btn" href="#/tut/${id}">ทบทวนบทเรียน</a></div>`)
            }
            const x = g.qz[Q.i];
            app(`${back(id)}<h1>ทดสอบความเข้าใจ</h1><p class="mut">ข้อที่ ${Q.i + 1} จาก ${n}</p><div class="card2"><p><b>${E(x.c)}</b></p>${opts(x, Q.a, 'qa')}</div>${Q.a == null ? '' : fb(x, Q.a) + `<button class="btn pri" onclick="qn()">${Q.i == n - 1 ? 'ดูผล' : 'ข้อถัดไป'}</button>`}`)
        }
        const qa = j => { const x = G1(Q.id).qz[Q.i]; Q.a = j; if (j == x.a) Q.s++; quiz(Q.id) };
        const qn = () => { Q.i++; Q.a = null; quiz(Q.id) };
        const qr = () => { const id = Q.id; Q = {}; quiz(id) };

        /* FR-5 / FR-8 ผู้ช่วย AI: ค้นฐานความรู้ของเกม (RAG) แล้วให้โมเดลบน Ollama เรียบเรียงคำตอบ */
        let W = 0; const TH = 1.2;
        const SW = ['คืออะไร', 'ทำอย่างไร', 'อย่างไร', 'เมื่อไหร่', 'เมื่อไร', 'เท่าไหร่', 'เท่าไร', 'ที่ไหน', 'ตรงไหน', 'อะไร', 'ไหม', 'หรือไม่', 'ยังไง', 'ทำไม', 'ใคร', 'กี่', 'บ้าง', 'ช่วย', 'หน่อย', 'ของ', 'ขอ', 'และ', 'แล้ว', 'ที่', 'เป็น', 'คือ', 'ให้', 'ได้', 'จะ', 'ต้อง', 'ควร', 'เกม', 'เล่น', 'ครับ', 'ค่ะ'];
        const tok = (t, q) => { t = t.toLowerCase(); if (q) SW.forEach(w => t = t.split(w).join(' ')); const r = new Set((t.match(/[a-z0-9]{2,}/g) || []).map(w => 'w' + w)); t.split(/[^\u0E00-\u0E7F]+/).forEach(x => { x = x.replace(/[\u0E31\u0E34-\u0E3A\u0E47-\u0E4E]/g, ''); for (let i = 0; i < x.length - 1; i++)r.add(x.slice(i, i + 2)) }); return r };
        const kb = g => [...g.st.map(x => ({ t: x[0], x: x[1], k: 'บทเรียน' })), ...g.r.map(x => ({ t: x[0], x: x[1], k: 'กฎ' }))];
        function retr(g, q) {
            const C = kb(g).map(c => ({ ...c, b: tok(c.t + ' ' + c.x), h: tok(c.t) })), Q = [...tok(q, 1)], df = {};
            Q.forEach(b => df[b] = C.filter(c => c.b.has(b)).length);
            return C.map(c => { let s = c.k == 'กฎ' ? .1 : 0, n = 0, st = 0; Q.forEach(b => { if (c.b.has(b) && df[b]) { s += (b[0] == 'w' ? 3 : 1) / df[b] * (c.h.has(b) ? 1.5 : 1); n++; if (b[0] == 'w') st = 1 } }); return { c, s, ok: (st || n >= 3) && s >= TH } }).filter(o => o.ok).sort((x, y) => y.s - x.s).slice(0, 3).map(o => o.c)
        }
        async function llm(g, cv, hits, q) {
            const c = new AbortController(), tm = setTimeout(() => c.abort(), 90000);
            const ctx = hits.map((h, i) => `[${i + 1}] ${h.k}: ${h.t} - ${h.x}`).join('\n');
            const hist = cv.slice(-9, -1).filter(m => !m.e).map(m => ({ role: m.r == 'u' ? 'user' : 'assistant', content: m.t }));
            try {
                const r = await fetch(S.cfg.url.replace(/\/$/, '') + '/api/chat', {
                    method: 'POST', signal: c.signal, headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: S.cfg.m, stream: false, messages: [{ role: 'system', content: `คุณคือผู้ช่วยอธิบายกฎบอร์ดเกม ${g.n} ตอบเป็นภาษาไทย สั้น ชัดเจน ใช้เฉพาะข้อมูลอ้างอิงที่ให้ ถ้าข้อมูลไม่พอให้บอกว่าไม่แน่ใจ ห้ามเดา` }, ...hist, { role: 'user', content: `ข้อมูลอ้างอิง:\n${ctx}\n\nคำถาม: ${q}` }] })
                });
                if (!r.ok) throw 0; const j = await r.json(); return j.message.content.trim()
            } finally { clearTimeout(tm) }
        }
        const bub = m => `<div class="bb ${m.r}${m.e ? ' err' : ''}">${E(m.t).replace(/\n/g, '<br>')}${m.s && m.s.length ? `<div class="src">${m.s.map(x => `<span class="tag">📖 ${E(x)}</span>`).join('')}</div>` : ''}${m.ms ? `<small class="mut">ตอบใน ${(m.ms / 1000).toFixed(1)} วินาที${m.demo ? ' · โหมดสาธิต ไม่ผ่านโมเดล' : ''}</small>` : ''}</div>`;
        const draw = () => { const c = $('#cv'); if (!c) return; const l = S.cv[S.lg] || []; c.innerHTML = (l.map(bub).join('') || '<p class="mut">ถามกฎของเกมนี้ได้เลย ผู้ช่วยจะตอบจากฐานความรู้ของเกมและแสดงแหล่งอ้างอิง ถามต่อจากคำตอบเดิมได้โดยไม่ต้องพิมพ์คำถามซ้ำ</p>') + (W ? '<div class="bb a mut">กำลังค้นข้อมูลและเรียบเรียงคำตอบ...</div>' : ''); if (c.lastElementChild) c.lastElementChild.scrollIntoView({ block: 'nearest' }) };
        function ai(id) {
            const l = pub(); let g = G1(id || S.lg); if (!g || !(g.pub || S.ad)) g = l[0];
            if (!g) return app('<h1>ผู้ช่วย AI</h1><p class="mut">ยังไม่มีเกมที่เผยแพร่</p>');
            S.lg = g.id; const r = S.rt, a = r.length ? (r.reduce((x, y) => x + y, 0) / r.length / 1000).toFixed(1) : 0;
            app(`<h1>ผู้ช่วย AI ตอบกฎ</h1><label>เกมที่ต้องการถาม<select id="aig" onchange="location.hash='#/ai/'+this.value">${l.map(x => `<option value="${x.id}" ${x.id == g.id ? 'selected' : ''}>${E(x.n)}</option>`).join('')}</select></label>
 <details class="card2"><summary><b>ตั้งค่าโมเดล (Ollama)</b></summary><label>Ollama URL<input id="ou" class="in" value="${E(S.cfg.url)}"></label><label>ชื่อโมเดล<input id="om" class="in" value="${E(S.cfg.m)}"></label><label><input type="checkbox" id="od" ${S.cfg.demo ? 'checked' : ''}> โหมดสาธิต (ตอบจากฐานความรู้โดยไม่เรียกโมเดล)</label><div class="row"><button class="btn pri" onclick="scfg()">บันทึกตั้งค่า</button></div><p class="mut">${r.length ? `เวลาตอบเฉลี่ย ${a} วินาที จาก ${r.length} ครั้งล่าสุด` : 'ยังไม่มีข้อมูลเวลาตอบ'}</p></details>
 <div id="cv" class="cv"></div>
 <div class="chips">${g.r.slice(0, 4).map((x, i) => `<button class="tag" onclick="fq(${i})">${E(x[0])} คืออะไร</button>`).join('')}</div>
 <div class="ask"><input id="qi" class="in" placeholder="พิมพ์คำถามเกี่ยวกับกฎ..." aria-label="คำถาม" onkeydown="if(event.key=='Enter')ask()"><button class="btn pri" onclick="ask()">ส่ง</button></div>
 <button class="btn" onclick="nc()">เริ่มบทสนทนาใหม่</button>`); draw()
        }
        const fq = i => { $('#qi').value = G1(S.lg).r[i][0] + ' คืออะไร'; $('#qi').focus() };
        const nc = () => { delete S.cv[S.lg]; save(); ai(S.lg) };
        function scfg() { S.cfg = { url: V('ou') || 'http://localhost:11434', m: V('om') || 'llama3.2', demo: $('#od').checked ? 1 : 0 }; save(); msg('บันทึกตั้งค่าแล้ว') }
        async function ask() {
            const g = G1(S.lg), i = $('#qi'), q = i.value.trim(); if (!q) return msg('พิมพ์คำถามก่อนส่ง');
            const cv = S.cv[g.id] = S.cv[g.id] || [], prev = [...cv].reverse().find(m => m.r == 'u');
            cv.push({ r: 'u', t: q }); i.value = '';
            const fin = m => { cv.push(m); W = 0; S.cv[g.id] = cv.slice(-30); save(); draw() };
            W = 1; draw();
            if (q.replace(/[\s\u0021-\u002F\u003A-\u0040]+/g, '').length < 3) return fin({ r: 'a', t: 'ขอรายละเอียดเพิ่มอีกนิดได้ไหม เช่น อยากรู้กฎข้อไหนหรือสถานการณ์แบบไหน จะได้หาข้อมูลได้ตรงขึ้น' });
            let h = retr(g, q);
            if (!h.length && prev && (q.length <= 8 || /แล้ว|ล่ะ|นั้น|นี้|ต่อ|อีก|งั้น|เหมือน|ตัวอย่าง|เพิ่มเติม|อธิบาย/.test(q))) h = retr(g, prev.t + ' ' + q);
            if (!h.length) return fin({ r: 'a', t: 'ไม่พบข้อมูลที่รองรับคำถามนี้ในฐานความรู้ของเกมนี้ จึงยังตอบไม่ได้ ลองถามให้เฉพาะเจาะจงขึ้น หรือตรวจกติกาในคู่มือเกม' });
            const t0 = performance.now(); let a;
            try { a = S.cfg.demo ? 'ตามฐานความรู้ของเกมนี้: ' + h[0].x + (h[1] ? '\n\nที่เกี่ยวข้อง: ' + h[1].x : '') : await llm(g, cv, h, q) }
            catch (e) { return fin({ r: 'a', e: 1, t: 'ผู้ช่วย AI ใช้งานไม่ได้ในขณะนี้ ตรวจสอบว่าเปิด Ollama อยู่ และ URL กับชื่อโมเดลในส่วนตั้งค่าถูกต้อง แล้วลองส่งอีกครั้ง หรือเปิดโหมดสาธิตเพื่อดูหน้าจอโดยไม่เรียกโมเดล' }) }
            const ms = performance.now() - t0; S.rt = [...S.rt, Math.round(ms)].slice(-30);
            fin({ r: 'a', t: a, s: h.map(x => x.k + ': ' + x.t), ms, demo: S.cfg.demo })
        }

 <div class="grid"><div class="card"><span class="n">${Object.keys(S.p).length}</span><span class="mut">เกมที่เริ่มเรียนแล้ว</span></div><div class="card"><span class="n">${d}</span><span class="mut">ขั้นตอนที่เรียนแล้ว</span></div><div class="card"><span class="n">${Object.keys(S.q).length}</span><span class="mut">เกมที่ทำแบบทดสอบแล้ว</span></div></div>
 <p class="mut">ข้อมูลการเรียนของคุณเก็บไว้ในเบราว์เซอร์เครื่องนี้เท่านั้น</p>`)

        function sf() { const x = V('fx'); if (!x) return msg('เขียนรายละเอียดก่อนส่ง'); S.fb.unshift({ t: V('ft'), x }); save(); fbp(); msg('ส่งข้อเสนอแนะแล้ว') }

function asit(){const c=V('sc'),o=V('so').split('\n').map(s=>s.trim()).filter(Boolean),a=+V('sa')-1,w=V('sw');
