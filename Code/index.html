<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Board Game Tutor</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#DDDFF5;--bg2:#FFFFFF;--ink:#1B2238;--felt:#2F6BFF;--pt:#fff;--card:#fff;--line:#D5D9EC;--red:#D6453D;--ok:#1F7A4D;--mut:#5F6784;--sb:rgba(255,255,255,.55);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#161F40;--bg2:#0B1124;--ink:#E7EBFA;--felt:#6C98FF;--pt:#0B1124;--card:#18213F;--line:#2B3764;--mut:#9AA6CF;--ok:#4CC38A;--red:#F07A72;--sb:rgba(24,33,63,.7)}}
:root[data-theme="dark"]{--bg1:#161F40;--bg2:#0B1124;--ink:#E7EBFA;--felt:#6C98FF;--pt:#0B1124;--card:#18213F;--line:#2B3764;--mut:#9AA6CF;--ok:#4CC38A;--red:#F07A72;--sb:rgba(24,33,63,.7)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2) 65%) fixed,var(--bg2);font:16px/1.6 'Noto Sans Thai',system-ui,sans-serif}
#shell{display:flex;min-height:100vh}
aside{width:230px;flex:none;align-self:flex-start;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh;display:flex;flex-direction:column;padding:14px 0;background:var(--sb);border-right:1px solid var(--line);transition:width .2s}
aside svg{flex:none;color:var(--felt)}
aside button{background:none;border:0;cursor:pointer;color:var(--felt);padding:0}
#mb{align-self:flex-end;margin:0 21px 12px 0}
aside nav a{display:flex;align-items:center;gap:14px;padding:14px 21px;color:var(--ink);text-decoration:none;border-top:1px solid var(--line);font-weight:600;font-size:15px}
aside nav a.on{background:color-mix(in srgb,var(--felt) 13%,transparent)}
.out{margin:auto 0 0 21px;padding:8px 0!important;align-self:flex-start}
.mini aside{width:62px}.mini aside nav span{display:none}
@media(max-width:760px){aside{width:62px}aside nav span{display:none}.mainw{padding:18px 14px 64px!important}}
.mainw{flex:1;min-width:0;padding:24px 30px 64px}
.sbar{position:relative;max-width:640px;margin:0 auto 28px}
.sbar span{position:absolute;left:20px;top:50%;transform:translateY(-50%);display:flex;color:var(--mut)}
.sbar input{width:100%;padding:13px 20px 13px 52px;border-radius:999px;border:1.5px solid var(--mut);background:transparent;color:var(--ink);font:inherit}
main{max-width:960px;margin:0 auto}
h1,h2{font-weight:700;line-height:1.4;margin:.2em 0 .6em}
h1{font-size:24px}h2{font-size:17px;margin-top:1.1em}
a{color:var(--felt)}
.mut{color:var(--mut)}
.hm{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:36px}
@media(max-width:820px){.hm{grid-template-columns:1fr;gap:8px}}
.feat{display:flex;align-items:flex-end;height:190px;border-radius:18px;padding:18px;color:#fff;text-decoration:none;font-weight:700;font-size:17px;background:linear-gradient(115deg,#13A050 0 52%,#1F2B5A 52%)}
.feat i{width:34px;height:34px;border:2px solid #fff;border-radius:9px;display:inline-grid;place-items:center;margin-right:10px}
.feat svg{color:#fff}
.tags{margin:12px 0 4px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cat{aspect-ratio:1;border-radius:14px;color:#fff;padding:14px;display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;font-weight:700}
.cat svg{color:#fff}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card,.card2{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;color:inherit}
.card{display:flex;flex-direction:column;gap:6px;text-decoration:none}
a.card:hover{border-color:var(--felt)}
.card2{margin:12px 0}
.em{font-size:34px;line-height:1.2}
.n{font-size:28px;font-weight:700;line-height:1.2}
.tag{display:inline-block;background:color-mix(in srgb,var(--mut) 14%,transparent);border-radius:999px;padding:1px 12px;font-size:13px;margin:0 6px 4px 0}
label{display:block;font-weight:600}
.in,select,textarea{width:100%;padding:10px 13px;margin:6px 0 12px;font:inherit;font-weight:400;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px}
.btn{font:inherit;font-weight:600;padding:9px 18px;border-radius:10px;border:2px solid var(--felt);background:transparent;color:var(--felt);cursor:pointer;text-decoration:none;display:inline-block}
.btn.pri{background:var(--felt);color:var(--pt)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.opt{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:10px;padding:11px 14px;margin:8px 0;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--felt)}
.opt.ok{border-color:var(--ok)}.opt.bad{border-color:var(--red)}
.fb{padding:12px 14px;border-radius:10px;border-left:6px solid;background:var(--card);margin:12px 0}
.fb.ok{border-color:var(--ok)}.fb.bad{border-color:var(--red)}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--felt)}
.ck{list-style:none;padding:0;margin:4px 0;font-size:14px}
summary{cursor:pointer}
:focus-visible{outline:3px solid var(--felt);outline-offset:2px}
#t{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg2);padding:10px 18px;border-radius:10px;display:none;z-index:9;max-width:92%}
.cds{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0 4px}
.cd{width:124px;min-height:176px;padding:12px 10px;border-radius:14px;border:2px solid hsl(var(--h) 50% 42%);background:linear-gradient(160deg,hsl(var(--h) 75% 94%),hsl(var(--h) 65% 82%));color:#1B2238;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;box-shadow:0 3px 0 hsl(var(--h) 50% 42% / .35)}
.ci{font-size:40px;line-height:1.1}.cd b{font-size:14px;line-height:1.3}.cd small{font-size:12px;line-height:1.35}
@media(prefers-reduced-motion:no-preference){.cd{transition:transform .15s}.cd:hover{transform:translateY(-4px) rotate(-1.5deg)}}
.cv{display:flex;flex-direction:column;gap:10px;margin:14px 0;min-height:120px}
.bb{max-width:88%;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);overflow-wrap:anywhere}
.bb.u{align-self:flex-end;background:var(--felt);color:var(--pt);border-color:var(--felt)}
.bb.err{border-color:var(--red)}
.src{margin-top:6px}
.chips{margin:6px 0 10px}
.chips .tag{border:0;cursor:pointer;font-family:inherit;color:var(--ink)}
.ask{display:flex;gap:8px;align-items:flex-start}
.ask .in{margin:0;flex:1}
</style>
</head>
<body>

<script>

</script>

</body>
</html>
